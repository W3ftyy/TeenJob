name: Update job listings

on:
  schedule:
    - cron: "0 5 */3 * *"   # about every 3 days at 05:00 UTC
  workflow_dispatch:         # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Update listings
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          APIFY_ACTOR: ${{ vars.APIFY_ACTOR }}
          APIFY_INPUT: ${{ vars.APIFY_INPUT }}
        run: python update_listings.py
      - name: Commit changes
        run: |
          git config user.name "listings-bot"
          git config user.email "listings-bot@users.noreply.github.com"
          git add listings.json
          git diff --cached --quiet || (git commit -m "Update listings" && git push)
