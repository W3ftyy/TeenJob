.mute{color:var(--mute);font-size:.9rem}

function rankLocal(profile){
  var town=(profile.town||"").toLowerCase();
  var scored=visible(profile.age).map(function(l){
    var k=KEYS[l.id]||{tags:[],when:[]},score=0,why=[],ll=L(l);
    var hit=k.tags.filter(function(x){return profile.interests.indexOf(x)>-1});
    if(hit.length){score+=hit.length*2;why.push(tx("whyInt",{x:hit.slice(0,2).map(cl).join(", ")}))}
    var wh=k.when.filter(function(x){return profile.availability.indexOf(x)>-1});
    if(wh.length){score+=2;why.push(tx("whyWhen",{x:cl(wh[0])}))}
    if(town&&(l.town+" "+ll.town).toLowerCase().indexOf(town)>-1){score+=3;why.push(tx("whyTown",{x:ll.town}))}
    if(l.status==="open")score+=1;
    return {id:l.id,score:score,why:why.length?why.join("; ")+".":tx("whyNone")};
  });
  scored.sort(function(a,b){return b.score-a.score});
  return {matches:scored.map(function(m){return {id:m.id,why:m.why}})};
}
function ideasLocal(profile){
  var out=[],seen={};
  function add(k,type,wk){var d=IDEAS[k];if(!d||profile.age<d[0]||seen[k])return;seen[k]=1;
    var title=LANG==="et"?d[2].charAt(0).toUpperCase()+d[2].slice(1):(LANG==="ru"?(IDEA_RU[k]||d[1]):d[1]);
    out.push({title:title,type:tx(type),why:tx(wk,{x:cl(k)}),how:tx("matchHow"),search:d[2]})}
  profile.interests.forEach(function(k){add(k,"ideaT","whyIdea")});
  ["Shop assistant","Shelf stocking","Cleaning","Customer service"].forEach(function(k){if(out.length<5)add(k,"common","whyCommon")});
  return {legal_note:tx(profile.age<18?"legalMinor":"legalAdult"),jobs:out.slice(0,5),tip:tx("tip")};
}

function today(){var d=new Date();return d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2)+"-"+("0"+d.getDate()).slice(-2)}
function dropExpired(){var t=today();for(var i=LISTINGS.length-1;i>=0;i--){var l=LISTINGS[i];if(l.status==="open"&&l.deadline_iso&&l.deadline_iso<t)LISTINGS.splice(i,1)}}
function autoGeo(l){var c=[],tw=(l.town||"").toLowerCase();GROUPS.forEach(function(g){if(tw.indexOf(g[1].toLowerCase()+" maakond")>-1&&c.indexOf("county:"+g[0])<0)c.push("county:"+g[0]);g[4].forEach(function(p){var q=p.split("|");if(tw.indexOf(q[1].toLowerCase())>-1){c.push(q[0]);if(c.indexOf("county:"+g[0])<0)c.push("county:"+g[0])}})});return c}
var TAGMAP=[["klienditeenindaja|customer|müüja|seller|kassa","Customer service","Shop assistant"],["kaubapaigutaja|stocker|shelf","Shelf stocking"],["koristaja|cleaner|puhastus","Cleaning"],["nõudepesija|dishwasher","Dishwashing / kitchen help"],["kokk|köögi|kitchen|cook","Cooking","Dishwashing / kitchen help"],["ladu|laotööline|warehouse","Warehouse"],["ettekandja|teenindaja|waiter|barista","Café / waiter"],["kuller|courier|delivery|flaier","Delivery / flyers"],["toateenindaja|housekeep","Hotel housekeeping"],["jõuluabiline|suveabiline|hooaja|seasonal","Shop assistant"]];
function autoTags(l){var t=(l.title||"").toLowerCase(),out=[];TAGMAP.forEach(function(r){if(new RegExp(r[0]).test(t))r.slice(1).forEach(function(x){if(out.indexOf(x)<0)out.push(x)})});return out}
function loadListings(){
  dropExpired();renderBoard();
  fetch("listings.json?"+Date.now(),{cache:"no-store"}).then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(d){
    if(!d||!d.listings||!d.listings.length)return;
    LISTINGS.length=0;
    d.listings.forEach(function(x){
      if(!x.id||!x.title||!x.url)return;
      var l={id:x.id,title:x.title,employer:x.employer||"",town:x.town||"",status:x.status||"open",deadline:x.deadline||"",deadline_iso:x.deadline_iso||"",minAge:x.minAge==null?null:x.minAge,pay:x.pay||"",note:x.note||"",url:x.url};
      if(x.maxAge)l.maxAge=x.maxAge;
      LISTINGS.push(l);TRL[x.id]=x.tr||{};
      LOC[x.id]={c:(x.c&&x.c.length)?x.c:autoGeo(l),d:x.d};
      KEYS[x.id]={tags:(x.tags&&x.tags.length)?x.tags:autoTags(l),when:x.when||[]};
    });
    if(d.updated)UPD=d.updated;
    dropExpired();applyStatic();page=1;renderBoard();
  }).catch(function(){});
}

  renderBoard();
}
